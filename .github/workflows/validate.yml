name: Validate System Seller
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Unit tests
        run: node --test tests/*.test.cjs
      - name: JavaScript syntax
        run: |
          node --check config.js
          node --check service-worker.js
          for f in js/*.js; do node --check "$f"; done
      - name: Validate modular references and JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html=Path("index.html").read_text()
          required=[
            "styles.css","modular.css","manifest.webmanifest","config.js",
            "js/core.js","js/time.js","js/auth.js","js/pages.js","js/actions.js",
            "js/customer-pricing.js","js/offline-sync.js","js/order-extensions.js","js/payments.js",
            "js/quotes.js","js/production.js","js/calendar.js","js/offline-cache.js",
            "js/costs.js","js/reports.js","js/attachments.js","js/three-d-pricing.js","js/inventory-3d.js",
            "js/notifications.js","js/sync-conflicts.js","js/documents.js","js/backup-modular.js",
            "js/pwa.js","js/modular-shell.js","js/three-d-pricing-ui.js","js/main.js"
          ]
          missing=[x for x in required if x not in html or not Path(x).exists()]
          if missing:
              raise SystemExit("Missing references/files: "+", ".join(missing))
          json.loads(Path("vercel.json").read_text())
          manifest=json.loads(Path("manifest.webmanifest").read_text())
          if manifest.get("display") != "standalone":
              raise SystemExit("PWA manifest must use standalone display")
          sw=Path("service-worker.js").read_text()
          for asset in ["offline-cache.js","sync-conflicts.js","backup-modular.js","three-d-pricing.js","three-d-pricing-ui.js","manifest.webmanifest"]:
              if asset not in sw:
                  raise SystemExit("Service worker missing: "+asset)
          print("Static checks OK")
          PY
      - name: Validate modular behavior markers
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            "js/quotes.js":["convert_quote_to_order","create_quote"],
            "js/production.js":["upsert_order_production","production_stage_history"],
            "js/customer-pricing.js":["customer_product_prices"],
            "js/costs.js":["record_order_cost","profitForOrder"],
            "js/inventory-3d.js":["consume_filament","enable_3d"],
            "js/three-d-pricing.js":["calculate3DPricing","suggested_price","effective_margin_pct"],
            "js/three-d-pricing-ui.js":["electricity_price_per_kwh","default_3d_margin_pct",".order-line",".quote-line","Preço sugerido","Preço final","order_3d_details"],
            "js/offline-sync.js":["apply_offline_mutation","order_notes","production_update"],
            "js/sync-conflicts.js":["resolve_sync_conflict"],
            "js/backup-modular.js":["schema_version:2","restore_workspace_backup_v2"],
            "js/notifications.js":["queue_business_email","process-business-email"],
            "js/documents.js":["generated_documents","work_order"]
          }
          missing=[]
          for file,needles in checks.items():
              text=Path(file).read_text()
              for needle in needles:
                  if needle not in text: missing.append(f"{file}:{needle}")
          if missing:
              raise SystemExit("Missing modular behavior markers: "+", ".join(missing))
          print("Behavior markers OK")
          PY
      - name: Reject privileged credential values in frontend
        run: |
          if grep -R -E "sb_secret_|SUPABASE_SERVICE_ROLE_KEY|xkeysib-[A-Za-z0-9_-]{16,}" config.js js index.html service-worker.js manifest.webmanifest; then
            echo "Privileged credential value marker found in frontend"
            exit 1
          fi
      - name: Security regression checks
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          for workflow in [".github/workflows/pages.yml", ".github/workflows/validate.yml"]:
              for number, line in enumerate(Path(workflow).read_text().splitlines(), 1):
                  if line.lstrip().startswith("- uses:"):
                      ref = line.split("@", 1)[1].split()[0]
                      if not re.fullmatch(r"[0-9a-f]{40}", ref):
                          raise SystemExit(f"Mutable action reference in {workflow}:{number}")

          html = Path("index.html").read_text()
          scripts = [tag for tag in re.findall(r"<script[^>]*>", html, re.I) if 'src="https://cdn.jsdelivr.net' in tag]
          if len(scripts) != 2:
              raise SystemExit(f"Expected 2 pinned CDN scripts, found {len(scripts)}")
          for tag in scripts:
              if 'integrity="sha256-' not in tag:
                  raise SystemExit("CDN script missing SRI integrity")
              if 'crossorigin="anonymous"' not in tag:
                  raise SystemExit("CDN script missing crossorigin=anonymous")

          marker = '<meta http-equiv="Content-Security-Policy"'
          start = html.find(marker)
          if start < 0:
              raise SystemExit("index.html CSP meta tag missing")
          meta_tag = html[start:html.find(">", start) + 1]
          meta_policy = meta_tag.split('content="', 1)[1].split('"', 1)[0]
          config = json.loads(Path("vercel.json").read_text())
          header_policy = next(h["value"] for rule in config["headers"] for h in rule["headers"] if h["key"] == "Content-Security-Policy")
          def directive(policy, name):
              return next((part.strip() for part in policy.split(";") if part.strip().startswith(name + " ")), "")
          if directive(meta_policy, "connect-src") != directive(header_policy, "connect-src"):
              raise SystemExit("CSP connect-src differs between index.html and vercel.json")

          if "Math.random" in Path("js/offline-sync.js").read_text():
              raise SystemExit("Insecure Math.random remains in offline ID generation")
          print("Security regression checks OK")
          PY
