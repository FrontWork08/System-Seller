name: Validate System Seller
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript syntax
        run: |
          node --check config.js
          node --check service-worker.js
          for f in js/*.js; do node --check "$f"; done
      - name: Validate static references and JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html=Path("index.html").read_text()
          required=[
            "styles.css","modular.css","manifest.webmanifest","config.js",
            "js/core.js","js/time.js","js/auth.js","js/pages.js","js/actions.js","js/payments.js",
            "js/modular-shell.js","js/customer-pricing.js","js/quotes.js","js/production.js","js/calendar.js",
            "js/costs.js","js/reports.js","js/attachments.js","js/inventory-3d.js","js/notifications.js",
            "js/documents.js","js/offline-sync.js","js/backup-expansion.js","js/pwa.js","js/main.js"
          ]
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit("Missing references: "+", ".join(missing))
          json.loads(Path("vercel.json").read_text())
          json.loads(Path("manifest.webmanifest").read_text())
          sw=Path("service-worker.js").read_text()
          if "system-seller-shell" not in sw:
              raise SystemExit("Service worker cache marker missing")
          print("Static checks OK")
          PY
      - name: Reject privileged credentials in frontend
        run: |
          if grep -R -E "sb_secret_|SUPABASE_SERVICE_ROLE_KEY" config.js js index.html service-worker.js manifest.webmanifest; then
            echo "Privileged credential marker found in frontend"
            exit 1
          fi
